name: ICT FVG Telegram Paper Alerts

on:
  schedule:
    - cron: '2-59/5 * * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ict-fvg-telegram-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install app requirements
        run: pip install -r requirements.txt
      - name: Monitor paper signals and send Telegram messages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MONITOR_SYMBOLS: NQ,ES,NDX,SPX
        run: python monitor.py
      - name: Commit alert state (deduplication and exit tracking)
        if: always()
        run: |
          if ! git diff --quiet -- data/alerts_state.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/alerts_state.json
            git commit -m 'Update ICT FVG paper alert state [skip ci]'
            git push
          fi
